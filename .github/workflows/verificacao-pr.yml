name: Verificação de Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-frontend:
    name: Build do cliente React
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do cliente
        working-directory: frontend
        run: npm ci

      - name: Compilar cliente
        working-directory: frontend
        run: npm run build

  testes-python:
    name: Testes da API Django
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/src
    env:
      SECRET_KEY: ci-test-secret-key

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências da API
        run: python -m pip install -r ../requirements.txt

      - name: Verificar configuração Django
        run: python manage.py check

      - name: Verificar migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Executar testes
        run: python manage.py test app
