name: Deploy da API Django

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-producao
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Atualizar a VPS via SSM
        shell: bash
        run: |
          set -euo pipefail

          remote_script="$(cat <<'SCRIPT'
          set -eu
          sudo -H -u ubuntu bash -lc '
            set -eu
            repo=/home/ubuntu/PECDII_26.2_8001_I
            cd "$repo"
            git pull --ff-only origin main

            # O cliente React é compilado na VPS e servido como arquivo estático pelo Nginx.
            node_manager="$HOME/.nvm/nvm.sh"
            if [ ! -s "$node_manager" ]; then
              printf "NVM ausente para ubuntu; instale Node.js 26 antes do deploy.\\n" >&2
              exit 1
            fi
            . "$node_manager"
            cd "$repo/frontend"
            nvm install
            nvm use
            npm ci
            npm run build

            # O refactor moveu o código versionado, mas .venv, .env e o SQLite são
            # arquivos locais ignorados pelo Git e permaneceram em src/ na VPS.
            for nome in .venv .env db.sqlite3; do
              origem="$repo/src/$nome"
              destino="$repo/backend/src/$nome"
              if [ ! -e "$origem" ]; then
                printf "Estado de produção ausente: %s\\n" "$origem" >&2
                exit 1
              fi
              if [ -L "$destino" ]; then
                if [ "$(readlink -f "$destino")" != "$(readlink -f "$origem")" ]; then
                  printf "Link de estado inesperado: %s\\n" "$destino" >&2
                  exit 1
                fi
              elif [ -e "$destino" ]; then
                printf "Destino já existe; recusando sobrescrever: %s\\n" "$destino" >&2
                exit 1
              else
                ln -s "$origem" "$destino"
              fi
            done

            cd "$repo/backend/src"
            .venv/bin/python -m pip install -r ../requirements.txt
            .venv/bin/python manage.py migrate
            .venv/bin/python manage.py collectstatic --noinput
          '
          cp -r /home/ubuntu/PECDII_26.2_8001_I/backend/src/staticfiles/. /var/www/PECDII_26.2_8001_I/static/
          install -d -m 0755 /var/www/PECDII_26.2_8001_I/frontend
          cp -r /home/ubuntu/PECDII_26.2_8001_I/frontend/dist/. /var/www/PECDII_26.2_8001_I/frontend/
          install -m 0644 /home/ubuntu/PECDII_26.2_8001_I/deploy/nginx/pbe.conf /etc/nginx/sites-available/pbe
          ln -sfn /etc/nginx/sites-available/pbe /etc/nginx/sites-enabled/pbe
          nginx -t
          mkdir -p /etc/systemd/system/pbe.service.d
          install -m 0644 /home/ubuntu/PECDII_26.2_8001_I/deploy/systemd/pbe.service.d/override.conf /etc/systemd/system/pbe.service.d/override.conf
          install -m 0644 /home/ubuntu/PECDII_26.2_8001_I/deploy/systemd/pbe-notificar-sessoes.service /etc/systemd/system/pbe-notificar-sessoes.service
          install -m 0644 /home/ubuntu/PECDII_26.2_8001_I/deploy/systemd/pbe-notificar-sessoes.timer /etc/systemd/system/pbe-notificar-sessoes.timer
          systemctl daemon-reload
          systemctl enable --now pbe-notificar-sessoes.timer
          systemctl restart pbe
          systemctl reload nginx
          SCRIPT
          )"

          parameters="$(jq -cn --arg command "$remote_script" '{commands: [$command]}')"

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text
